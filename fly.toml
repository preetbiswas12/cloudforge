# Fly.io configuration for CloudForge.
#   fly launch --no-deploy --copy-config
#   fly volumes create cloudforge_data --size 1 --region iad
#   fly secrets set EDITOR_TOKEN=... GIT_REMOTE=... GIT_REMOTE_TOKEN=...
#   fly deploy

app = "cloudforge"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  WORKSPACE_DIR = "/workspace"
  WEB_DIST = "/app/web/dist"

# A single machine only: a Fly volume can be mounted by exactly one machine at
# a time, so scaling out would break. Use multiple machines with a shared git
# remote instead.
[[mounts]]
  source = "cloudforge_data"
  target = "/workspace"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cp-1x"
  memory = "512mb"